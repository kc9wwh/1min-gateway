[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1min-gateway"
version = "0.1.0"
description = "Stateless OpenAI-compatible translation gateway that emulates tool calling on top of 1min.ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
1min-gateway = "onemin_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onemin_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
